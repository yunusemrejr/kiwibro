    <ellipse cx="27.500" cy="46.400" rx=".95" ry="1.550"/>
    <ellipse cx="20.100" cy="39" rx="1.550" ry=".95"/>
    <ellipse cx="34.900" cy="39" rx="1.550" ry=".95"/>
    <ellipse cx="22.270" cy="33.770" rx=".95" ry="1.550" transform="rotate(-45 22.270 33.770)"/>
    <ellipse cx="32.730" cy="33.770" rx=".95" ry="1.550" transform="rotate(45 32.730 33.770)"/>
    <ellipse cx="22.270" cy="44.230" rx=".95" ry="1.550" transform="rotate(45 22.270 44.230)"/>
    <ellipse cx="32.730" cy="44.230" rx=".95" ry="1.550" transform="rotate(-45 32.730 44.230)"/>
