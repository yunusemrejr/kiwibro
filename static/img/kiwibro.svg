  <circle cx="27.500" cy="39" r="13.500" fill="none" stroke="#5F9628" stroke-width="1.200" opacity=".7"/>
  <g stroke="#E4F4A8" stroke-width=".9" stroke-linecap="round" opacity=".55">
    <path d="M27.5 31.200v-3.400M33 33.500l2.400-2.400M35.3 39h3.400M33 44.500l2.4 2.400M27.5 46.800v3.400M22 44.500l-2.4 2.400M19.7 39h-3.400M22 33.500l-2.400-2.400"/>
  </g>
