    <path d="M33 55v5.2M33 60.2l-3.4 1.5M33 60.2l3.4 1.6"/>
  </g>
  <!-- body and head: one fuzzy kiwi -->
  <path d="M8.5 40C8.5 26.5 18.5 17.2 31 17.2c3 0 5-1.6 7-3.4 4.3-3.8 11.6-2.9 14.3 2.2 2.2 4.2 .7 9-3.3 11.200-1.8 1-2.3 3.300-2.3 6.300.2 1.800.5 3.700.5 5.800C47.2 50 39.2 57.5 28 57.5 17 57.5 8.5 50.5 8.5 40Z" fill="url(#kbSkin)"/>
