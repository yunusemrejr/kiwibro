services:
  {{name}}:
    build: .
    image: {{name}}:local
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    # The health check runs inside the container, so it needs no curl in the image.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
