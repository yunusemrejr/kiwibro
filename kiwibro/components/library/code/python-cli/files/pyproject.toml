[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# KIWIBRO: the name, description and version users see on install
name = "{{name}}"
version = "0.1.0"
description = "Report lines, words and characters for text files"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
{{name}} = "{{name}}.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
