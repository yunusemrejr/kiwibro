<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <main id="main" class="wrap">
    <h1>{{title}}</h1>

    <!-- KIWIBRO: sample options; every control's name must have a default in settings.js -->
    <form id="settings">
      <fieldset>
        <legend>Display</legend>
        <div class="row">
          <label for="textSize">Text size</label>
          <select id="textSize" name="textSize">
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>
        </div>
        <div class="row">
          <label for="compact">Compact lists</label>
          <input id="compact" name="compact" type="checkbox" role="switch">
        </div>
      </fieldset>

      <fieldset>
        <legend>Notifications</legend>
        <div class="row">
          <label for="email">Email summary</label>
          <input id="email" name="email" type="checkbox" role="switch">
        </div>
        <div class="row">
          <label for="sound">Play a sound</label>
          <input id="sound" name="sound" type="checkbox" role="switch">
        </div>
        <div class="row">
          <label for="digest">Summary day</label>
          <select id="digest" name="digest">
            <option value="monday">Monday</option>
            <option value="friday">Friday</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Profile</legend>
        <div class="stack">
          <label for="displayName">Display name</label>
          <input id="displayName" name="displayName" type="text" maxlength="40" autocomplete="nickname">
        </div>
      </fieldset>

      <div class="footer">
        <button type="button" id="reset">Reset to defaults</button>
        <p id="saved" role="status"></p>
      </div>
    </form>
  </main>

  <script src="settings.js"></script>
</body>
</html>
