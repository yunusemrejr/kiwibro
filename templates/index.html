<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15160f">
  <meta name="description" content="Kiwibro — a local AI agent that lives on your machine.">
  <title>Kiwibro</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/img/kiwibro-128.png">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/markdown.css">
  <link rel="stylesheet" href="/static/css/attachments.css">
  <link rel="stylesheet" href="/static/css/inference.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <link rel="stylesheet" href="/static/css/models.css">
  <link rel="stylesheet" href="/static/css/notes.css">
  <link rel="stylesheet" href="/static/css/how.css">
</head>
<body>

    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.3V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.7a2 2 0 0 0-1.1-1.8l-1.8-.9A2 2 0 0 1 15 10.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l.8 12.2A2 2 0 0 0 9.3 21h5.4a2 2 0 0 0 2-1.8L17.5 7M10 11v6M14 11v6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3.5a2.6 2.6 0 0 1 3.7 3.7L7.5 20.4 3 21.5l1.1-4.5Z"/><path d="M14.5 6l3.5 3.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 20h17a1.5 1.5 0 0 0 1.5-1.5V8.5A1.5 1.5 0 0 0 20.5 7H13l-2-2.5A1.5 1.5 0 0 0 9.8 4H3.5A1.5 1.5 0 0 0 2 5.5v13A1.5 1.5 0 0 0 3.5 20Z"/></symbol>

    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 21s-7.5-3.5-7.5-9V5.8L12 3l7.5 2.8V12c0 5.5-7.5 9-7.5 9Z"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6M20.5 3.5V9H15"/></symbol>

    <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8Z"/><path d="M14 3v5h5M9.5 14h5M12 11.5v5"/></symbol>

  </svg>

  <div class="app" id="app">
    <header class="headerbar">
      <div class="header-left">
        <button class="icon-btn" id="sidebar-toggle" type="button" aria-label="Toggle sidebar" title="Toggle sidebar" aria-controls="sidebar" aria-expanded="true">
          <svg class="icon" aria-hidden="true"><use href="#i-panel"/></svg>
        </button>
        <button class="brand" id="brand-home" type="button" aria-label="Kiwibro — new chat">
          <img class="brand-mark" src="/static/img/kiwibro.svg" alt="" width="24" height="24">
          <span class="brand-name">Kiwibro</span>
        </button>
      </div>
      <div class="header-center">
        <button class="model-pill" id="model-pill" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="model-popover" title="Switch model">
          <span class="status-dot" id="model-dot" data-tone="idle" aria-hidden="true"></span>
          <span class="model-pill-name" id="model-pill-name">Loading…</span>
          <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </button>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="memory-btn" type="button" aria-label="Memory" title="Memory">
          <svg class="icon" aria-hidden="true"><use href="#i-bookmark"/></svg>
          <span class="icon-badge" id="memory-badge" hidden>0</span>
        </button>
        <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings" title="Settings — Ctrl+,">
          <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <div class="sidebar-top">
          <button class="new-chat" id="new-chat" type="button" title="New chat — Ctrl+N">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
            <span>New chat</span>
          </button>
          <nav class="places" aria-label="Kiwibro">
            <button class="place" id="place-notes" type="button" data-tone="tan">
              <svg class="icon" aria-hidden="true"><use href="#i-note"/></svg>
              <span class="place-name">Notes</span>
              <span class="place-count" id="place-notes-count"></span>
            </button>
            <button class="place" id="place-memory" type="button" data-tone="tan">
              <svg class="icon" aria-hidden="true"><use href="#i-bookmark"/></svg>
              <span class="place-name">Memory</span>
              <span class="place-count" id="place-memory-count"></span>
            </button>
            <button class="place" id="place-models" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-cube"/></svg>
              <span class="place-name">Models</span>
              <span class="place-count" id="place-models-count"></span>
            </button>
            <button class="place" id="place-how" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-route"/></svg>
              <span class="place-name">How it works</span>
            </button>
          </nav>
          <div class="conv-filter"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="conv-search" placeholder="Filter chats…" aria-label="Filter chats" autocomplete="off" spellcheck="false"></div>
        </div>
        <nav class="conv-scroll" aria-label="Conversations">
          <div class="conv-list" id="conv-list"></div>
          <p class="conv-empty" id="conv-empty" hidden>No chats yet.</p>
        </nav>
        <div class="sidebar-footer">
          <button class="sidebar-stat sidebar-model" id="sidebar-model" type="button" title="Models">
            <span class="status-dot" id="sidebar-dot" data-tone="idle" aria-hidden="true"></span>
            <span id="sidebar-model-name">—</span>
          </button>
        </div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <main class="main" id="main">
        <div class="transcript" id="transcript" role="log" aria-label="Conversation">
          <div class="chat" id="chat">
            <section class="empty" id="empty-state" aria-labelledby="empty-title">
              <div class="hero-bird" aria-hidden="true">
                <svg class="hero-slice" viewBox="0 0 200 200">
                  <circle class="hero-slice-flesh" cx="100" cy="100" r="96"/>
                  <g class="hero-slice-seeds">
                    <ellipse cx="100" cy="30" rx="3" ry="6"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(30 100 100)"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(60 100 100)"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(90 100 100)"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(120 100 100)"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(150 100 100)"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(180 100 100)"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(210 100 100)"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(240 100 100)"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(270 100 100)"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(300 100 100)"/>
                    <ellipse cx="100" cy="30" rx="3" ry="6" transform="rotate(330 100 100)"/>
                  </g>
                </svg>
                <svg class="hero-kiwi" viewBox="5 8 60 56">
                  <defs>
                    <linearGradient id="hkSkin" x1="16" y1="14" x2="40" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9A268"/><stop offset="1" stop-color="#8F6B3C"/></linearGradient>
                    <radialGradient id="hkFlesh" cx="27.5" cy="39" r="13.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D6EE8E"/><stop offset=".45" stop-color="#A9D95A"/><stop offset="1" stop-color="#7DB83A"/></radialGradient>
                    <linearGradient id="hkBeak" x1="50" y1="17" x2="63" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F7EBCF"/><stop offset="1" stop-color="#D8BC8A"/></linearGradient>
                  </defs>
                  <g stroke="#E0C08C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
                    <path d="M22.5 55v5.2M22.5 60.2l-3.6 1.5M22.5 60.2l3.2 1.6"/>
                    <path d="M33 55v5.2M33 60.2l-3.4 1.5M33 60.2l3.4 1.6"/>
                  </g>
                  <g class="hero-kiwi-body">
                    <path d="M8.5 40C8.5 26.5 18.5 17.2 31 17.2c3 0 5-1.6 7-3.4 4.3-3.8 11.6-2.9 14.3 2.2 2.2 4.2.7 9-3.3 11.2-1.8 1-2.3 3.3-2.3 6.3.2 1.8.5 3.7.5 5.8C47.2 50 39.2 57.5 28 57.5 17 57.5 8.5 50.5 8.5 40Z" fill="url(#hkSkin)"/>
                    <path d="M12.6 31.5c2.6-6 8.2-10.3 15.2-11.3" stroke="#F3DCA8" stroke-width="1.8" stroke-linecap="round" opacity=".42" fill="none"/>
                    <circle cx="27.5" cy="39" r="13.5" fill="url(#hkFlesh)"/>
                    <circle cx="27.5" cy="39" r="13.5" fill="none" stroke="#5F9628" stroke-width="1.2" opacity=".7"/>
                    <g stroke="#E4F4A8" stroke-width=".9" stroke-linecap="round" opacity=".55">
                      <path d="M27.5 31.2v-3.4M33 33.5l2.4-2.4M35.3 39h3.4M33 44.5l2.4 2.4M27.5 46.8v3.4M22 44.5l-2.4 2.4M19.7 39h-3.4M22 33.5l-2.4-2.4"/>
                    </g>
                    <ellipse cx="27.5" cy="39" rx="4.3" ry="4.7" fill="#F6F3CE"/>
                    <g fill="#1B1D12">
                      <ellipse cx="27.5" cy="31.6" rx=".95" ry="1.55"/>
                      <ellipse cx="27.5" cy="46.4" rx=".95" ry="1.55"/>
                      <ellipse cx="20.1" cy="39" rx="1.55" ry=".95"/>
                      <ellipse cx="34.9" cy="39" rx="1.55" ry=".95"/>
                      <ellipse cx="22.27" cy="33.77" rx=".95" ry="1.55" transform="rotate(-45 22.27 33.77)"/>
                      <ellipse cx="32.73" cy="33.77" rx=".95" ry="1.55" transform="rotate(45 32.73 33.77)"/>
                      <ellipse cx="22.27" cy="44.23" rx=".95" ry="1.55" transform="rotate(45 22.27 44.23)"/>
                      <ellipse cx="32.73" cy="44.23" rx=".95" ry="1.55" transform="rotate(-45 32.73 44.23)"/>
                    </g>
                    <path d="M51.6 16.9c4.9 2.3 9.3 6.9 11.8 12.9-4.9-2-9.6-4.9-13.3-8.4-.3-1.7.3-3.4 1.5-4.5Z" fill="url(#hkBeak)"/>
                    <g class="hero-kiwi-eye">
                      <circle cx="45.7" cy="18.6" r="2.25" fill="#1B1D12"/>
                      <circle cx="46.4" cy="17.8" r=".75" fill="#FBF8EC"/>
                    </g>
                  </g>
                </svg>
              </div>
              <h1 class="empty-title" id="empty-title">Kiwibro</h1>
              <p class="empty-sub">A local AI that keeps its beak out of the cloud.</p>
              <button class="hero-setup" id="hero-setup" type="button" hidden>
                <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
                <span id="hero-setup-text"></span>
              </button>
              <div class="starters" role="group" aria-label="Things to try">
                <button class="starter" type="button" data-prompt="What's in the news today? Search the web.">
                  <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>
                  <span class="starter-name">Look it up</span>
                  <span class="starter-ask">What's in the news today?</span>
                </button>
                <button class="starter" type="button" data-prompt="How much free disk space do I have?">
                  <svg class="icon" aria-hidden="true"><use href="#i-terminal"/></svg>
                  <span class="starter-name">Use this computer</span>
                  <span class="starter-ask">How much free disk space do I have?</span>
                </button>
                <button class="starter" type="button" data-prompt="Write a Python script that renames photos by the date they were taken.">
                  <svg class="icon" aria-hidden="true"><use href="#i-file-plus"/></svg>
                  <span class="starter-name">Write code</span>
                  <span class="starter-ask">A script that renames photos by date</span>
                </button>
                <button class="starter" type="button" data-tone="tan" data-prompt="What do you remember about me?">
                  <svg class="icon" aria-hidden="true"><use href="#i-bookmark"/></svg>
                  <span class="starter-name">Remember</span>
                  <span class="starter-ask">What do you remember about me?</span>
                </button>
              </div>
            </section>
          </div>
        </div>

        <button class="scroll-bottom" id="scroll-bottom" type="button" aria-label="Scroll to latest message" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-arrow-down"/></svg>
        </button>

        <div class="dock" id="dock">
          <div class="dock-inner">
            <div class="dock-hint" id="dock-hint" hidden>
              <span class="status-dot" data-tone="warn" aria-hidden="true"></span>
              <span class="dock-hint-text" id="dock-hint-text"></span>
              <button class="text-btn" id="dock-retry" type="button">Retry</button>
            </div>
            <form class="composer" id="composer">
              <label class="sr-only" for="composer-input">Message Kiwibro</label>
              <textarea class="composer-input" id="composer-input" rows="1" maxlength="400000" placeholder="Ask Kiwibro…" autocomplete="off" spellcheck="true"></textarea>
              <div class="composer-bar">
                <div class="composer-left">
                  <button class="agent-toggle" id="agent-toggle" type="button" aria-pressed="true" title="Agent mode — tools and memory">
                    <svg class="icon" aria-hidden="true"><use href="#i-tool"/></svg>
                    <span>Agent</span>
                  </button>
                  <button class="agent-toggle private-toggle" id="private-toggle" type="button" aria-pressed="false" title="Make this chat private">
                    <svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>
                    <span>Private</span>
                  </button>
                </div>
                <div class="composer-right">
                  <div class="context-ring" id="context-ring" title="Context usage" aria-label="Context usage">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle class="ring-track" cx="12" cy="12" r="9"/>
                      <circle class="ring-value" id="ring-value" cx="12" cy="12" r="9"/>
                    </svg>
                  </div>
                  <button class="send-btn" id="send-btn" type="submit" aria-label="Send message" title="Send" disabled>
                    <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>
                  </button>
                  <button class="send-btn stop-btn" id="stop-btn" type="button" aria-label="Stop generating" title="Stop — Esc" hidden>
                    <svg class="icon" aria-hidden="true"><use href="#i-stop"/></svg>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="popover-layer" id="popover-layer"></div>
  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>
  <div class="sr-only" id="live-status" role="status" aria-live="polite"></div>

  <dialog class="sheet sheet-memory" id="memory-sheet" aria-labelledby="memory-title">
    <div class="sheet-head">
      <div class="sheet-heading">
        <h2 class="sheet-title" id="memory-title">Memory</h2>
        <span class="sheet-count" id="memory-count"></span>
      </div>
      <button class="icon-btn sheet-close" type="button" aria-label="Close memory" data-close-sheet>
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="sheet-toolbar">
      <div class="search-field">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="memory-search" placeholder="Search memory" aria-label="Search memories" autocomplete="off" spellcheck="false">
      </div>
      <div class="kind-chips" id="memory-kinds" role="group" aria-label="Filter memories by kind">
        <button class="kind-chip" type="button" data-kind="" aria-pressed="true">All</button>
        <button class="kind-chip" type="button" data-kind="fact" aria-pressed="false">Fact</button>
        <button class="kind-chip" type="button" data-kind="preference" aria-pressed="false">Preference</button>
        <button class="kind-chip" type="button" data-kind="project" aria-pressed="false">Project</button>
        <button class="kind-chip" type="button" data-kind="person" aria-pressed="false">Person</button>
        <button class="kind-chip" type="button" data-kind="decision" aria-pressed="false">Decision</button>
      </div>
    </div>
    <div class="sheet-scroll">
      <div class="memory-list" id="memory-list"></div>
    </div>
    <form class="memory-add" id="memory-add-form">
      <input class="memory-add-input" id="memory-new" type="text" maxlength="300" placeholder="Add a memory…" aria-label="New memory" autocomplete="off">
      <select class="memory-add-kind" id="memory-new-kind" aria-label="Memory kind">
        <option value="fact">Fact</option>
        <option value="preference">Preference</option>
        <option value="project">Project</option>
        <option value="person">Person</option>
        <option value="decision">Decision</option>
      </select>
      <button class="btn btn-primary btn-compact" type="submit" disabled>Add</button>
    </form>
    <div class="sheet-foot">
      <span class="sheet-foot-hint">Things Kiwibro remembers about you.</span>
      <button class="text-btn danger" id="forget-all-btn" type="button">Forget all</button>
    </div>
  </dialog>

  <dialog class="sheet sheet-settings" id="settings-sheet" aria-labelledby="settings-title">
    <div class="sheet-head">
      <div class="sheet-heading">
        <h2 class="sheet-title" id="settings-title">Settings</h2>
      </div>
      <button class="icon-btn sheet-close" type="button" aria-label="Close settings" data-close-sheet>
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="sheet-scroll" id="settings-body"></div>
    <div class="sheet-foot">
      <span class="sheet-foot-hint" id="settings-version">Kiwibro</span>
      <span class="sheet-foot-hint" id="settings-engine"></span>
    </div>
  </dialog>

  <dialog class="sheet sheet-wide" id="models-sheet" aria-labelledby="models-title">
    <div class="sheet-head">
      <div class="sheet-heading">
        <h2 class="sheet-title" id="models-title">Models</h2>
      </div>
      <button class="icon-btn sheet-close" type="button" aria-label="Close models" data-close-sheet>
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="sheet-scroll" id="models-body"></div>
  </dialog>

  <dialog class="sheet sheet-wide" id="notes-sheet" aria-labelledby="notes-title">
    <div class="sheet-head">
      <div class="sheet-heading">
        <h2 class="sheet-title" id="notes-title">Notes</h2>
        <span class="sheet-count" id="notes-count"></span>
      </div>
      <button class="icon-btn sheet-close" type="button" aria-label="Close notes" data-close-sheet>
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="notes-body"></div>
  </dialog>

  <dialog class="sheet sheet-wide" id="how-sheet" aria-labelledby="how-title">
    <div class="sheet-head">
      <div class="sheet-heading">
        <h2 class="sheet-title" id="how-title">How it works</h2>
      </div>
      <button class="icon-btn sheet-close" type="button" aria-label="Close how it works" data-close-sheet>
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="how-body"></div>
  </dialog>

  <noscript>
    <div class="noscript">Kiwibro needs JavaScript to run. It is served locally — no data leaves this machine.</div>
  </noscript>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
